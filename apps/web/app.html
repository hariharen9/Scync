<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />

  <!-- Primary Meta Tags -->
  <title>Scync Vault</title>
  <meta name="title" content="Scync Vault" />
  <meta name="description" content="Scync vault application." />
  <meta name="author" content="Scync Team" />
  <meta name="theme-color" content="#060606" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&display=swap"
    rel="stylesheet" />
</head>

<body style="background-color: #060606; color: white; margin: 0; font-family: sans-serif; overflow: hidden;">
  <div id="root">
    <div id="loading-state"
      style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: #060606;">
      <style>
        .brutalist-spinner {
          width: 48px;
          height: 48px;
          border: 2px solid #222;
          border-top-color: #fff;
          animation: b-spin 0.8s cubic-bezier(0.6, 0.2, 0.4, 0.8) infinite;
          margin-bottom: 32px;
        }

        @keyframes b-spin {
          0% {
            transform: rotate(0deg);
          }

          100% {
            transform: rotate(360deg);
          }
        }

        .b-text {
          font-family: 'Space Grotesk', sans-serif;
          font-size: 28px;
          font-weight: 800;
          text-transform: uppercase;
          letter-spacing: -0.02em;
          color: #fff;
          margin: 0;
          line-height: 1;
        }

        .b-sub {
          font-family: 'DM Mono', monospace;
          font-size: 11px;
          color: #666;
          margin-top: 12px;
          letter-spacing: 0.1em;
          text-transform: uppercase;
        }

        .b-blink {
          animation: b-blink 1s step-end infinite;
        }

        @keyframes b-blink {

          0%,
          100% {
            opacity: 1;
          }

          50% {
            opacity: 0;
          }
        }

        #error-display {
          color: #ef4444;
          max-width: 80%;
          text-align: center;
          font-family: 'DM Mono', monospace;
          font-size: 12px;
          white-space: pre-wrap;
          margin-top: 32px;
          border: 1px solid rgba(239, 68, 68, 0.2);
          padding: 16px;
          background: rgba(239, 68, 68, 0.05);
          display: none;
        }
      </style>
      <div class="brutalist-spinner"></div>
      <h1 class="b-text">SCYNC</h1>
      <div class="b-sub">Establishing Zero-Knowledge Void<span class="b-blink">_</span></div>
      <div id="error-display"></div>
    </div>
  </div>

  <script>
    // Global error handler to help debug production issues
    window.onerror = function (msg, url, lineNo, columnNo, error) {
      const display = document.getElementById('error-display');
      if (display) {
        display.style.display = 'block';
        display.innerText = 'Error: ' + msg + '\nAt: ' + url + ':' + lineNo + ':' + columnNo + (error ? '\nStack: ' + error.stack : '');
      }
      return false;
    };

    window.addEventListener('unhandledrejection', function (event) {
      const display = document.getElementById('error-display');
      if (display) {
        display.style.display = 'block';
        display.innerText = 'Promise Rejection: ' + event.reason + (event.reason && event.reason.stack ? '\nStack: ' + event.reason.stack : '');
      }
    });
  </script>
  <script type="module" src="/src/app/main.tsx"></script>
</body>

</html>
